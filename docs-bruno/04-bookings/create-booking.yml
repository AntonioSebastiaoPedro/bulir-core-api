opencollection: 1.0.0
info:
  name: "Create Booking (Client)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/bookings"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{clientToken}}"
  body:
    type: json
    data: |-
      {
        "serviceId": "{{serviceId}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if ((res.status === 200 || res.status === 201) && res.body?.data?.id) {
          bru.setEnvVar("bookingId", res.body.data.id);
          bru.setVar("bookingId", res.body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
