opencollection: 1.0.0
info:
  name: "Login Provider"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{providerEmail}}",
        "password": "{{providerPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.accessToken) {
          bru.setEnvVar("providerToken", res.body.data.accessToken);
          bru.setVar("providerToken", res.body.data.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
