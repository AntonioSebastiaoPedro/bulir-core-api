info:
  name: Register Client
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Ana Silva",
        "nif": "{{clientNif}}",
        "email": "{{clientEmail}}",
        "password": "{{clientPassword}}",
        "role": "CLIENT"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
