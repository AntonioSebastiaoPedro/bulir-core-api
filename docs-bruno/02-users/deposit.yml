opencollection: 1.0.0
info:
  name: "Deposit Balance (Client)"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/users/deposit"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{clientToken}}"
  body:
    type: json
    data: |-
      {
        "amount": 5000
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
